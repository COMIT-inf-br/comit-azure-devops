# Não testado em CI real: o workflow nunca rodou (repositório sem remote).
# Actions fixadas por SHA do commit da tag indicada no comentário.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Instalar o Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.323
      - name: V1 manifests (plugin)
        run: claude plugin validate --strict plugins/comit-azure-devops
      - name: V1 manifests (marketplace)
        run: claude plugin validate --strict .
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: V7 sem identidade nem segredo
        run: uv run --python 3.12 --no-project python scripts/check_identity.py
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: V2 esquemas dos perfis
        run: uv run --python 3.12 --no-project python scripts/validate_profiles.py
      - name: V3 testes unitários
        run: uv run --python 3.12 --no-project -m unittest discover plugins/comit-azure-devops/tests/unit
